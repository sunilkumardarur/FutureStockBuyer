<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Stock Buyer</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #D4A843;
    --gold-light: #F0C96A;
    --gold-dim: rgba(212,168,67,0.15);
    --gold-glow: rgba(212,168,67,0.35);
    --bg: #0D0D0F;
    --bg2: #13131A;
    --bg3: #1A1A24;
    --bg4: #22222F;
    --surface: #1E1E2A;
    --surface2: #252535;
    --border: rgba(255,255,255,0.07);
    --border-gold: rgba(212,168,67,0.25);
    --text: #F0EFE8;
    --text2: #9A9898;
    --text3: #5A5868;
    --green: #4ADE80;
    --red: #F87171;
    --blue: #60A5FA;
    --purple: #A78BFA;
    --radius: 16px;
    --radius-sm: 10px;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  html, body { height: 100%; background: #000; }
  body { font-family: var(--font); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #root { width: 100%; display: flex; align-items: center; justify-content: center; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">







// ─── Utility ───────────────────────────────────────────────────────────────
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── Icons (SVG inline) ────────────────────────────────────────────────────
const Icon = ({ name, size = 20, color = 'currentColor', className = '' }) => {
  const paths = {
    home: "M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-5h-4v5H4a1 1 0 01-1-1V9.5z",
    search: "M11 19a8 8 0 100-16 8 8 0 000 16zm0 0l4 4",
    bell: "M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0",
    star: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
    plus: "M12 5v14M5 12h14",
    x: "M18 6L6 18M6 6l12 12",
    back: "M19 12H5M12 19l-7-7 7-7",
    trend_up: "M23 6l-9.5 9.5-5-5L1 18",
    trend_down: "M23 18l-9.5-9.5-5 5L1 6",
    chart: "M18 20V10M12 20V4M6 20v-6",
    settings: "M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z",
    check: "M20 6L9 17l-5-5",
    info: "M12 16v-4M12 8h.01M22 12a10 10 0 11-20 0 10 10 0 0120 0z",
    fire: "M12 2c0 0-5 6-5 10a5 5 0 0010 0c0-4-5-10-5-10z",
    clock: "M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2",
    grid: "M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",
    layers: "M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5",
    bookmark: "M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z",
    trash: "M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      <path d={paths[name]} />
    </svg>);

};

// ─── Badge ────────────────────────────────────────────────────────────────
const StatusBadge = ({ status }) => {
  const configs = {
    'Filed S-1': { bg: 'rgba(212,168,67,0.18)', color: '#D4A843', label: 'Filed S-1' },
    'Exploring': { bg: 'rgba(96,165,250,0.15)', color: '#60A5FA', label: 'Exploring' },
    'Rumored': { bg: 'rgba(167,139,250,0.15)', color: '#A78BFA', label: 'Rumored' },
    'Watching': { bg: 'rgba(148,163,184,0.12)', color: '#94A3B8', label: 'Watching' },
    'Listed': { bg: 'rgba(74,222,128,0.12)', color: '#4ADE80', label: 'Listed' },
    'Recently IPO\'d': { bg: 'rgba(74,222,128,0.15)', color: '#4ADE80', label: 'IPO\'d' },
    'Restructuring': { bg: 'rgba(248,113,113,0.12)', color: '#F87171', label: 'Restructuring' }
  };
  const cfg = configs[status] || configs['Watching'];
  return (
    <span style={{
      display: 'inline-block', padding: '2px 8px', borderRadius: 20,
      background: cfg.bg, color: cfg.color, fontSize: 11, fontWeight: 600,
      letterSpacing: '0.02em', whiteSpace: 'nowrap'
    }}>{cfg.label}</span>);

};

// ─── Confidence Bar ───────────────────────────────────────────────────────
const ConfidenceBar = ({ value }) => {
  const color = value >= 75 ? '#D4A843' : value >= 50 ? '#60A5FA' : '#94A3B8';
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
      <div style={{ flex: 1, height: 3, background: 'rgba(255,255,255,0.08)', borderRadius: 3, overflow: 'hidden' }}>
        <div style={{ width: `${value}%`, height: '100%', background: color, borderRadius: 3, transition: 'width 0.6s ease' }} />
      </div>
      <span style={{ fontSize: 10, color: color, fontFamily: 'var(--mono)', minWidth: 28 }}>{value}%</span>
    </div>);

};

// ─── Hype Meter ───────────────────────────────────────────────────────────
const HypeMeter = ({ value }) => {
  const bars = 5;
  const filled = Math.round(value / 100 * bars);
  return (
    <div style={{ display: 'flex', gap: 2, alignItems: 'center' }}>
      {Array.from({ length: bars }).map((_, i) =>
      <div key={i} style={{
        width: 4, height: 10 + i * 2,
        background: i < filled ? `rgba(212,168,67,${0.4 + i * 0.12})` : 'rgba(255,255,255,0.07)',
        borderRadius: 2
      }} />
      )}
    </div>);

};

// ─── SCREEN: Onboarding ───────────────────────────────────────────────────
const OnboardingScreen = ({ onDone }) => {
  const [selected, setSelected] = useState(new Set());
  const [step, setStep] = useState(0); // 0=welcome, 1=pick sectors

  const toggle = (id) => {
    setSelected((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  if (step === 0) return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '32px 28px', textAlign: 'center' }}>
      <div style={{ width: 72, height: 72, borderRadius: '50%', background: 'var(--gold-dim)', border: '1.5px solid var(--border-gold)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 24, fontSize: 32 }}>📈</div>
      <h1 style={{ fontSize: 26, fontWeight: 700, color: 'var(--text)', letterSpacing: '-0.02em', marginBottom: 10, lineHeight: 1.2 }}>Future<br />Stock Buyer</h1>
      <p style={{ color: 'var(--text2)', fontSize: 14, lineHeight: 1.6, maxWidth: 260, marginBottom: 32 }}>Track anticipated IPOs before they happen. Get ahead of the market.</p>
      <button onClick={() => setStep(1)} style={{
        width: '100%', padding: '16px', borderRadius: 14,
        background: 'var(--gold)', color: '#0D0D0F', fontWeight: 700, fontSize: 16,
        border: 'none', cursor: 'pointer', fontFamily: 'var(--font)'
      }}>Get Started</button>
      <p style={{ color: 'var(--text3)', fontSize: 12, marginTop: 14 }}>No account needed · Free to use</p>
    </div>);


  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* Fix 1: extra top padding to clear camera notch area */}
      <div style={{ padding: '8px 20px 10px' }}>
        <h2 style={{ fontSize: 20, fontWeight: 700, color: 'var(--text)', marginBottom: 4 }}>Pick your sectors</h2>
        <p style={{ color: 'var(--text2)', fontSize: 13 }}>Select industries you want to follow</p>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 16px 16px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
          {SECTORS.map((s) => {
            const on = selected.has(s.id);
            return (
              <button key={s.id} onClick={() => toggle(s.id)} style={{
                padding: '12px 6px', borderRadius: 14,
                background: on ? 'var(--gold-dim)' : 'var(--surface)',
                border: on ? '1.5px solid var(--border-gold)' : '1.5px solid transparent',
                cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
                transition: 'all 0.15s ease', position: 'relative'
              }}>
                {on && <div style={{ position: 'absolute', top: 6, right: 6, width: 14, height: 14, borderRadius: '50%', background: 'var(--gold)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#0D0D0F" strokeWidth="3"><path d="M20 6L9 17l-5-5" /></svg>
                </div>}
                <span style={{ fontSize: 22 }}>{s.icon}</span>
                <span style={{ fontSize: 10, color: on ? 'var(--gold)' : 'var(--text2)', fontWeight: on ? 600 : 400, textAlign: 'center', lineHeight: 1.3 }}>{s.label}</span>
              </button>);

          })}
        </div>
      </div>
      <div style={{ padding: '12px 16px 16px', borderTop: '1px solid var(--border)' }}>
        <button
          onClick={() => selected.size > 0 && onDone([...selected])}
          disabled={selected.size === 0}
          style={{
            width: '100%', padding: '15px', borderRadius: 14,
            background: selected.size > 0 ? 'var(--gold)' : 'var(--surface2)',
            color: selected.size > 0 ? '#0D0D0F' : 'var(--text3)',
            fontWeight: 700, fontSize: 15, border: 'none', cursor: selected.size > 0 ? 'pointer' : 'default',
            fontFamily: 'var(--font)', transition: 'all 0.2s'
          }}>
          {selected.size === 0 ? 'Select at least one sector' : `Continue with ${selected.size} sector${selected.size > 1 ? 's' : ''}`}
        </button>
      </div>
    </div>);

};

// ─── IPO Countdown ────────────────────────────────────────────────────────
const IPOCountdown = ({ etaDate }) => {
  const date = new Date(etaDate);
  const now = new Date('2026-05-02');
  const diff = Math.ceil((date - now) / (1000 * 60 * 60 * 24));
  if (diff <= 0) return <span style={{ color: 'var(--green)', fontSize: 11, fontFamily: 'var(--mono)' }}>Listed</span>;
  if (diff <= 30) return <span style={{ color: 'var(--gold)', fontSize: 11, fontFamily: 'var(--mono)' }}>{diff}d away</span>;
  const months = Math.ceil(diff / 30);
  return <span style={{ color: 'var(--text2)', fontSize: 11, fontFamily: 'var(--mono)' }}>~{months}mo</span>;
};

// ─── SCREEN: Dashboard ────────────────────────────────────────────────────
const DashboardScreen = ({ sectors, favorites, notifications, ipoData, onSectorPress, onCompanyPress, onFavRemove, onToggleFav, dashboardVariant }) => {
  const userSectors = SECTORS.filter((s) => sectors.includes(s.id));

  return (
    <div style={{ height: '100%', overflowY: 'auto', background: 'var(--bg)' }}>
      {/* Header — no "Good morning", clean title only */}
      <div style={{ padding: '10px 20px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <h1 style={{ fontSize: 22, fontWeight: 700, color: 'var(--text)', letterSpacing: '-0.02em' }}>Dashboard</h1>
        <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'var(--gold-dim)', border: '1px solid var(--border-gold)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16 }}>📈</div>
      </div>

      {/* Watchlist preview strip */}
      {favorites.length > 0 &&
      <div style={{ padding: '0 20px 16px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
            <h2 style={{ fontSize: 13, fontWeight: 600, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>⭐ Watchlist</h2>
          </div>
          <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 2 }}>
            {favorites.slice(0, 5).map((fav) =>
          <button key={fav.id} onClick={() => onCompanyPress(fav)} style={{
            flex: '0 0 auto', minWidth: 120, background: 'var(--surface)', border: '1px solid var(--border)',
            borderRadius: 12, padding: '10px 12px', cursor: 'pointer', textAlign: 'left'
          }}>
                <p style={{ fontSize: 13, fontWeight: 700, color: 'var(--text)', marginBottom: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 100 }}>
                  {fav.ticker ? `$${fav.ticker}` : fav.name.split(' ')[0]}
                </p>
                {fav.currentPrice ?
            <p style={{ ...{ fontSize: 12, color: fav.currentPrice > fav.ipoPrice ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)', fontWeight: 600 }, color: "rgb(201, 42, 42)" }}>
                    ${fav.currentPrice}
                  </p> :

            <StatusBadge status={fav.status} />
            }
              </button>
          )}
          </div>
        </div>
      }

      {/* Per-sector top 5 — one section per selected sector */}
      {userSectors.map((s) => {
        const preIPO = (ipoData[s.id] || []).filter((c) => c.status !== 'Listed' && c.status !== 'Recently IPO\'d').slice(0, 5);
        if (preIPO.length === 0) return null;
        return (
          <div key={s.id} style={{ padding: '0 20px 20px' }}>
            {/* Sector header — small & neat, tappable */}
            <button onClick={() => onSectorPress(s)} style={{
              display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10,
              background: 'transparent', border: 'none', cursor: 'pointer', padding: 0
            }}>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: `${s.color}20`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 15 }}>
                {s.icon}
              </div>
              <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--text)' }}>{s.label}</span>
              <span style={{ fontSize: 11, color: 'var(--text3)', marginLeft: 2 }}>→</span>
            </button>

            {/* Top 5 company rows */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
              {preIPO.map((c, i) => {
                const rankColors = [
                  { bg: '#D4A843', border: '#D4A843', text: '#0D0D0F' },           // 1 solid gold
                  { bg: 'rgba(192,192,192,0.25)', border: '#C0C0C0', text: '#C0C0C0' }, // 2 silver
                  { bg: 'rgba(205,127,50,0.25)', border: '#CD7F32', text: '#CD7F32' },  // 3 bronze
                  { bg: 'rgba(96,165,250,0.18)', border: '#60A5FA', text: '#60A5FA' },  // 4 blue
                  { bg: 'rgba(167,139,250,0.18)', border: '#A78BFA', text: '#A78BFA' }, // 5 purple
                ];
                const rank = rankColors[i] || rankColors[4];
                const isFav = favorites.some((f) => f.id === c.id);
                return (
                  <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 7 }}>
                    <button onClick={() => onCompanyPress(c)} style={{
                      flex: 1, background: 'var(--surface)', border: '1px solid var(--border)',
                      borderRadius: 13, padding: '11px 13px', cursor: 'pointer', textAlign: 'left',
                      display: 'flex', alignItems: 'center', gap: 10, minWidth: 0
                    }}>
                      {/* Rank badge */}
                      <div style={{ width: 24, height: 24, borderRadius: 7, background: rank.bg, border: `1.5px solid ${rank.border}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                        <span style={{ fontSize: 11, fontWeight: 700, color: rank.text, fontFamily: 'var(--mono)' }}>{i + 1}</span>
                      </div>
                      {/* Company info */}
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginBottom: 1 }}>{c.name}</p>
                        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                          <span style={{ fontSize: 10, color: 'var(--text3)' }}>{c.valuation}</span>
                          <span style={{ fontSize: 10, color: 'var(--text3)' }}>·</span>
                          <IPOCountdown etaDate={c.etaDate} />
                        </div>
                      </div>
                      {/* Status */}
                      <StatusBadge status={c.status} />
                    </button>
                    {/* Fix 2: inline star button on dashboard */}
                    <button onClick={(e) => {e.stopPropagation();onToggleFav(c);}} style={{
                      width: 34, height: 34, borderRadius: 10, flexShrink: 0,
                      background: isFav ? 'var(--gold-dim)' : 'var(--surface)',
                      border: isFav ? '1px solid var(--border-gold)' : '1px solid var(--border)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer'
                    }}>
                      <Icon name="star" size={15} color={isFav ? 'var(--gold)' : 'var(--text3)'} />
                    </button>
                  </div>);

              })}
            </div>
          </div>);

      })}

      <div style={{ height: 12 }} />
    </div>);

};

// ─── SCREEN: Sector Detail ────────────────────────────────────────────────
const SectorScreen = ({ sector, ipoData, favorites, onBack, onCompanyPress, onToggleFav, notifications, onToggleNotif }) => {
  const companies = ipoData[sector.id] || [];
  const preIPO = companies.filter((c) => c.status !== 'Listed' && c.status !== 'Recently IPO\'d');
  const listed = companies.filter((c) => c.status === 'Listed' || c.status === 'Recently IPO\'d');

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
      {/* Header — padded to sit below notch */}
      <div style={{ padding: '10px 20px 12px', display: 'flex', alignItems: 'center', gap: 12, borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
        <button onClick={onBack} style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--surface)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0 }}>
          <Icon name="back" size={18} color="var(--text2)" />
        </button>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: 1, minWidth: 0 }}>
          <span style={{ fontSize: 20 }}>{sector.icon}</span>
          <h1 style={{ fontSize: 17, fontWeight: 700, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{sector.label}</h1>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 20px' }}>
        {/* Top 5 Upcoming */}
        <h2 style={{ fontSize: 13, fontWeight: 600, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 12 }}>
          🎯 Top {Math.min(preIPO.length, 5)} Anticipated IPOs
        </h2>
        {preIPO.slice(0, 5).map((c, i) => {
          const isFav = favorites.some((f) => f.id === c.id);
          const hasNotif = notifications[c.id] && Object.values(notifications[c.id]).some(Boolean);
          return (
            <div key={c.id} style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 16, padding: '16px', marginBottom: 10 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 10 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 26, height: 26, borderRadius: 8, background: 'var(--gold-dim)', border: '1px solid var(--border-gold)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--gold)', fontFamily: 'var(--mono)' }}>{i + 1}</span>
                  </div>
                  <div>
                    <p style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{c.name}</p>
                    {c.ticker && <p style={{ fontSize: 11, color: 'var(--gold)', fontFamily: 'var(--mono)' }}>${c.ticker}</p>}
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button onClick={() => onToggleNotif(c)} style={{ width: 32, height: 32, borderRadius: 9, background: hasNotif ? 'rgba(212,168,67,0.18)' : 'var(--bg4)', border: hasNotif ? '1px solid var(--border-gold)' : '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>

// ─── SCREEN: Favorites / Watchlist ───────────────────────────────────────
const FavoritesScreen = ({ favorites, onCompanyPress, onRemoveFav, onAddFav, allCompanies }) => {
  const [search, setSearch] = useState('');
  const [searchResults, setSearchResults] = useState([]);
  const [showSearch, setShowSearch] = useState(false);

  const activeIPO = favorites.filter((f) => f.status !== 'Listed' && f.status !== 'Recently IPO\'d');
  const liveStocks = favorites.filter((f) => f.status === 'Listed' || f.status === 'Recently IPO\'d' || f.currentPrice);

  const handleSearch = (q) => {
    setSearch(q);
    if (!q.trim()) {setSearchResults([]);return;}
    const lower = q.toLowerCase();
    const results = allCompanies.filter((c) =>
    (c.name.toLowerCase().includes(lower) || c.ticker && c.ticker.toLowerCase().includes(lower)) &&
    !favorites.some((f) => f.id === c.id)
    ).slice(0, 6);
    setSearchResults(results);
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
      <div style={{ padding: '16px 20px 12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <h1 style={{ fontSize: 22, fontWeight: 700, color: 'var(--text)', letterSpacing: '-0.02em' }}>Watchlist</h1>
        <button onClick={() => setShowSearch(!showSearch)} style={{ width: 36, height: 36, borderRadius: 10, background: showSearch ? 'var(--gold-dim)' : 'var(--surface)', border: showSearch ? '1px solid var(--border-gold)' : '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          <Icon name={showSearch ? 'x' : 'plus'} size={18} color={showSearch ? 'var(--gold)' : 'var(--text2)'} />
        </button>
      </div>

      {showSearch &&
      <div style={{ padding: '0 20px 12px' }}>
          <input
          value={search}
          onChange={(e) => handleSearch(e.target.value)}
          placeholder="Search company or ticker..."
          autoFocus
          style={{
            width: '100%', padding: '10px 14px', borderRadius: 12,
            background: 'var(--surface)', border: '1px solid var(--border-gold)',
            color: 'var(--text)', fontSize: 14, outline: 'none', fontFamily: 'var(--font)'
          }} />
        
          {searchResults.length > 0 &&
        <div style={{ marginTop: 8, background: 'var(--surface2)', borderRadius: 12, overflow: 'hidden', border: '1px solid var(--border)' }}>
              {searchResults.map((c, i) =>
          <button key={c.id} onClick={() => {onAddFav(c);setSearch('');setSearchResults([]);setShowSearch(false);}} style={{
            width: '100%', padding: '10px 14px', background: 'transparent', border: 'none',
            borderBottom: i < searchResults.length - 1 ? '1px solid var(--border)' : 'none',
            cursor: 'pointer', textAlign: 'left', display: 'flex', justifyContent: 'space-between', alignItems: 'center'
          }}>
                  <div>
                    <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--text)' }}>{c.name}</p>
                    <p style={{ fontSize: 11, color: 'var(--text3)' }}>{c.sector} · {c.eta}</p>
                  </div>
                  <span style={{ fontSize: 11, color: 'var(--gold)', fontWeight: 600 }}>+ Add</span>
                </button>
          )}
            </div>
        }
        </div>
      }

      <div style={{ flex: 1, overflowY: 'auto', padding: '0 20px 20px' }}>
        {favorites.length === 0 &&
        <div style={{ textAlign: 'center', padding: '60px 20px' }}>
            <p style={{ fontSize: 32, marginBottom: 12 }}>⭐</p>
            <p style={{ fontSize: 16, fontWeight: 600, color: 'var(--text)', marginBottom: 6 }}>No watchlist items yet</p>
            <p style={{ fontSize: 13, color: 'var(--text3)' }}>Star companies from sector pages or search above</p>
          </div>
        }

        {/* Live / Listed */}
        {liveStocks.length > 0 &&
        <>
            <h2 style={{ fontSize: 13, fontWeight: 600, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 12 }}>📊 Listed Stocks</h2>
            {liveStocks.map((fav) => {
            const pct = fav.ipoPrice && fav.currentPrice ? ((fav.currentPrice - fav.ipoPrice) / fav.ipoPrice * 100).toFixed(1) : null;
            return (
              <div key={fav.id} style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14, padding: '14px', marginBottom: 10 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <p style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{fav.ticker ? `$${fav.ticker}` : fav.name}</p>
                        {fav.ticker && <p style={{ fontSize: 12, color: 'var(--text2)' }}>{fav.name}</p>}
                      </div>
                    </div>
                    <button onClick={() => onRemoveFav(fav)} style={{ width: 28, height: 28, borderRadius: 8, background: 'var(--bg4)', border: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>

                    {fav.ipoPrice && <div style={{ background: 'var(--bg3)', borderRadius: 8, padding: '8px' }}>
                      <p style={{ fontSize: 9, color: 'var(--text3)', marginBottom: 2 }}>IPO PRICE</p>
                      <p style={{ fontSize: 13, fontWeight: 700, color: 'var(--text)', fontFamily: 'var(--mono)' }}>${fav.ipoPrice}</p>
                    </div>}
                    {fav.currentPrice && <div style={{ background: 'var(--bg3)', borderRadius: 8, padding: '8px' }}>
                      <p style={{ fontSize: 9, color: 'var(--text3)', marginBottom: 2 }}>CURRENT</p>
                      <p style={{ fontSize: 13, fontWeight: 700, color: 'var(--text)', fontFamily: 'var(--mono)' }}>${fav.currentPrice}</p>
                    </div>}
                    {pct && <div style={{ background: 'var(--bg3)', borderRadius: 8, padding: '8px' }}>
                      <p style={{ fontSize: 9, color: 'var(--text3)', marginBottom: 2 }}>RETURN</p>
                      <p style={{ fontSize: 13, fontWeight: 700, color: pct > 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{pct > 0 ? '+' : ''}{pct}%</p>

                  </div>
                  <button onClick={() => onCompanyPress(fav)} style={{ marginTop: 8, width: '100%', padding: '6px', borderRadius: 8, background: 'transparent', border: '1px solid var(--border)', color: 'var(--text2)', fontSize: 12, cursor: 'pointer', fontFamily: 'var(--font)' }}>Details →</button>
                </div>);

          })}
          </>
        }

        {/* Pre-IPO watchlist */}
        {activeIPO.length > 0 &&
        <>
            <h2 style={{ fontSize: 13, fontWeight: 600, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 12, marginTop: liveStocks.length > 0 ? 16 : 0 }}>🎯 Tracking Pre-IPO</h2>
            {activeIPO.map((fav) =>
          <div key={fav.id} style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14, padding: '12px 14px', marginBottom: 8, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ flex: 1, minWidth: 0, cursor: 'pointer' }} onClick={() => onCompanyPress(fav)}>
                  <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--text)', marginBottom: 2 }}>{fav.name}</p>
                  <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>

                  <Icon name="trash" size={13} color="var(--text3)" />
                </button>
              </div>

          </>
        }
      </div>

};

                    }}>

};

// ─── SCREEN: IPO Calendar ─────────────────────────────────────────────────
const CalendarScreen = ({ sectors, ipoData, onCompanyPress }) => {
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const years = [2026, 2027, 2028];

  // Gather all pre-IPO companies across selected sectors
  const allPreIPO = [];
  sectors.forEach((sId) => {
    (ipoData[sId] || []).filter((c) => c.status !== 'Listed').forEach((c) => allPreIPO.push(c));
  });

  // Group by year+month
  const grouped = {};
  allPreIPO.forEach((c) => {
    const d = new Date(c.etaDate);
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(c);
  });

  const entries = [];
  years.forEach((y) => {
    months.forEach((m, mi) => {
      const key = `${y}-${mi}`;
      if (grouped[key] && grouped[key].length > 0) {
        entries.push({ year: y, month: m, monthIdx: mi, companies: grouped[key] });
      }
    });
  });

  const statusColor = { 'Filed S-1': '#D4A843', 'Exploring': '#60A5FA', 'Rumored': '#A78BFA', 'Watching': '#94A3B8', 'Restructuring': '#F87171' };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
      <div style={{ padding: '10px 20px 12px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
        <h1 style={{ fontSize: 22, fontWeight: 700, color: 'var(--text)', letterSpacing: '-0.02em' }}>IPO Calendar</h1>
        <p style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{allPreIPO.length} upcoming across your sectors</p>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 20px 20px' }}>
        {entries.length === 0 &&
        <div style={{ textAlign: 'center', padding: '60px 20px' }}>
            <p style={{ fontSize: 32, marginBottom: 12 }}>📅</p>
            <p style={{ fontSize: 15, color: 'var(--text2)' }}>No calendar data for your sectors yet</p>
          </div>
        }
        {entries.map(({ year, month, monthIdx, companies }) =>
        <div key={`${year}-${monthIdx}`} style={{ marginBottom: 20 }}>
            {/* Month header */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
              <div style={{ height: 1, flex: 1, background: 'var(--border)' }} />
              <span style={{ fontSize: 12, fontWeight: 700, color: 'var(--text3)', letterSpacing: '0.08em', textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{month} {year}</span>
              <div style={{ height: 1, flex: 1, background: 'var(--border)' }} />
            </div>
            {companies.map((c) => {
            const sector = SECTORS.find((s) => s.id === c.sector);
            const col = statusColor[c.status] || '#94A3B8';
            return (
              <button key={c.id} onClick={() => onCompanyPress(c)} style={{
                width: '100%', background: 'var(--surface)', border: '1px solid var(--border)',
                borderLeft: `3px solid ${col}`, borderRadius: 12,
                padding: '11px 13px', marginBottom: 8, cursor: 'pointer', textAlign: 'left',
                display: 'flex', alignItems: 'center', gap: 10
              }}>
                  <span style={{ fontSize: 18, flexShrink: 0 }}>{sector?.icon || '🏢'}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.name}</p>
                    <p style={{ fontSize: 11, color: 'var(--text3)' }}>{c.valuation} · {sector?.label}</p>
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}>
                    <StatusBadge status={c.status} />
                    <p style={{ fontSize: 10, color: 'var(--text3)', marginTop: 3, fontFamily: 'var(--mono)' }}>{c.eta}</p>
                  </div>
                </button>);

          })}
          </div>
        )}
      </div>
    </div>);

// ─── SCREEN: Portfolio Simulator ──────────────────────────────────────────
const PortfolioScreen = ({ favorites }) => {
  const listedFavs = favorites.filter((f) => f.ipoPrice && f.currentPrice);
  const [positions, setPositions] = useState(() => {
    const init = {};
    listedFavs.forEach((f) => {init[f.id] = { shares: 10, buyPrice: f.ipoPrice };});
    return init;
  });

  const setField = (id, field, val) => setPositions((prev) => ({
    ...prev,
    [id]: { ...(prev[id] || { shares: 10, buyPrice: 0 }), [field]: parseFloat(val) || 0 }
  }));

  const rows = listedFavs.map((f) => {
    const pos = positions[f.id] || { shares: 10, buyPrice: f.ipoPrice };
    const shares = pos.shares || 0;
    const buyPrice = pos.buyPrice || 0;
    const costBasis = shares * buyPrice;
    const currentVal = shares * f.currentPrice;
    const actualReturn = currentVal - costBasis;
    const actualPct = costBasis > 0 ? (actualReturn / costBasis * 100).toFixed(1) : '0';
    // If bought at IPO price instead
    const ipoCostBasis = shares * f.ipoPrice;
    const ipoReturn = currentVal - ipoCostBasis;
    const ipoPct = ipoCostBasis > 0 ? (ipoReturn / ipoCostBasis * 100).toFixed(1) : '0';
    return { ...f, pos, shares, buyPrice, costBasis, currentVal, actualReturn, actualPct, ipoCostBasis, ipoReturn, ipoPct };
  });

  const totalCost = rows.reduce((s, r) => s + r.costBasis, 0);
  const totalCurrent = rows.reduce((s, r) => s + r.currentVal, 0);
  const totalReturn = totalCurrent - totalCost;
  const totalPct = totalCost > 0 ? (totalReturn / totalCost * 100).toFixed(1) : '0';

  const fmt = (n) => {
    const abs = Math.abs(n);
    const sign = n >= 0 ? '+' : '-';
    if (abs >= 1000000) return `${sign}$${(abs / 1000000).toFixed(2)}M`;
    if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}K`;
    return `${sign}$${abs.toFixed(0)}`;
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
      <div style={{ padding: '10px 20px 12px', borderBottom: '1px solid var(--border)', flexShrink: 0 }}>
        <h1 style={{ fontSize: 22, fontWeight: 700, color: 'var(--text)', letterSpacing: '-0.02em' }}>Portfolio Sim</h1>
        <p style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>Enter your actual purchase — see real vs IPO-price return</p>
      </div>
      <div style={{ flex: 1, overflowY: 'auto', padding: '14px 20px 20px' }}>
        {listedFavs.length === 0 ?
        <div style={{ textAlign: 'center', padding: '60px 20px' }}>
            <p style={{ fontSize: 32, marginBottom: 12 }}>💼</p>
            <p style={{ fontSize: 15, fontWeight: 600, color: 'var(--text)', marginBottom: 6 }}>No listed stocks yet</p>
            <p style={{ fontSize: 13, color: 'var(--text3)', lineHeight: 1.5 }}>Add IPO'd stocks to your Watchlist to simulate here</p>
          </div> :

        <>
            {/* Summary */}
            <div style={{ background: 'var(--surface)', borderRadius: 16, padding: '14px', marginBottom: 16, border: '1px solid var(--border)' }}>
              <p style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10 }}>Portfolio Summary</p>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 10 }}>
                <div style={{ background: 'var(--bg3)', borderRadius: 10, padding: '10px 12px' }}>
                  <p style={{ fontSize: 10, color: 'var(--text3)', marginBottom: 3 }}>COST BASIS</p>
                  <p style={{ fontSize: 16, fontWeight: 700, color: 'var(--text)', fontFamily: 'var(--mono)' }}>${totalCost.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</p>
                </div>
                <div style={{ background: 'var(--bg3)', borderRadius: 10, padding: '10px 12px' }}>
                  <p style={{ fontSize: 10, color: 'var(--text3)', marginBottom: 3 }}>MARKET VALUE</p>
                  <p style={{ fontSize: 16, fontWeight: 700, color: 'var(--text)', fontFamily: 'var(--mono)' }}>${totalCurrent.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</p>
                </div>
              </div>
              <div style={{ background: totalReturn >= 0 ? 'rgba(74,222,128,0.1)' : 'rgba(248,113,113,0.1)', borderRadius: 10, padding: '10px 12px', textAlign: 'center' }}>
                <p style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 2 }}>TOTAL P&L</p>
                <p style={{ fontSize: 22, fontWeight: 700, color: totalReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{fmt(totalReturn)}</p>
                <p style={{ fontSize: 13, color: totalReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{totalPct > 0 ? '+' : ''}{totalPct}%</p>
              </div>
            </div>

            {/* Positions */}
            <p style={{ fontSize: 12, fontWeight: 600, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10 }}>Positions</p>
            {rows.map((r) =>
          <div key={r.id} style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14, padding: '14px', marginBottom: 12 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <div>
                    <p style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)' }}>{r.ticker ? `$${r.ticker}` : r.name}</p>
                    <p style={{ fontSize: 11, color: 'var(--text3)' }}>Current price: <span style={{ fontFamily: 'var(--mono)', color: 'var(--text2)' }}>${r.currentPrice}</span></p>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <p style={{ fontSize: 15, fontWeight: 700, color: r.actualReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{fmt(r.actualReturn)}</p>
                    <p style={{ fontSize: 11, color: r.actualReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{r.actualPct > 0 ? '+' : ''}{r.actualPct}%</p>
                  </div>
                </div>

                {/* Inputs: shares + buy price */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 12 }}>
                  <div>
                    <p style={{ fontSize: 10, color: 'var(--text3)', marginBottom: 4 }}>SHARES OWNED</p>
                    <div style={{ display: 'flex', alignItems: 'center', background: 'var(--bg3)', borderRadius: 8, border: '1px solid var(--border)', overflow: 'hidden' }}>
                      <input type="number" value={r.pos.shares} onChange={(e) => setField(r.id, 'shares', e.target.value)}
                  style={{ flex: 1, background: 'transparent', border: 'none', color: 'var(--text)', fontSize: 13, fontFamily: 'var(--mono)', padding: '7px 10px', outline: 'none', width: 0 }} />
                    </div>
                  </div>
                  <div>
                    <p style={{ fontSize: 10, color: 'var(--text3)', marginBottom: 4 }}>YOUR BUY PRICE</p>
                    <div style={{ display: 'flex', alignItems: 'center', background: 'var(--bg3)', borderRadius: 8, border: '1px solid var(--border)', overflow: 'hidden' }}>
                      <span style={{ padding: '7px 6px 7px 10px', fontSize: 12, color: 'var(--text3)' }}>$</span>
                      <input type="number" step="0.01" value={r.pos.buyPrice} onChange={(e) => setField(r.id, 'buyPrice', e.target.value)}
                  style={{ flex: 1, background: 'transparent', border: 'none', color: 'var(--text)', fontSize: 13, fontFamily: 'var(--mono)', padding: '7px 10px 7px 0', outline: 'none', width: 0 }} />
                    </div>
                  </div>
                </div>

                {/* Actual vs IPO comparison */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                  <div style={{ background: r.actualReturn >= 0 ? 'rgba(74,222,128,0.08)' : 'rgba(248,113,113,0.08)', borderRadius: 10, padding: '9px 10px' }}>
                    <p style={{ fontSize: 9, color: 'var(--text3)', marginBottom: 3 }}>YOUR ACTUAL RETURN</p>
                    <p style={{ fontSize: 13, fontWeight: 700, color: r.actualReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{fmt(r.actualReturn)}</p>
                    <p style={{ fontSize: 10, color: r.actualReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{r.actualPct > 0 ? '+' : ''}{r.actualPct}%</p>
                    <p style={{ fontSize: 9, color: 'var(--text3)', marginTop: 2 }}>@ ${r.buyPrice}/share</p>
                  </div>

                    <p style={{ fontSize: 9, color: 'var(--text3)', marginBottom: 3 }}>IF BOUGHT AT IPO</p>
                    <p style={{ fontSize: 13, fontWeight: 700, color: r.ipoReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{fmt(r.ipoReturn)}</p>
                    <p style={{ fontSize: 10, color: r.ipoReturn >= 0 ? 'var(--green)' : 'var(--red)', fontFamily: 'var(--mono)' }}>{r.ipoPct > 0 ? '+' : ''}{r.ipoPct}%</p>
                    <p style={{ fontSize: 9, color: 'var(--gold)', marginTop: 2 }}>@ ${r.ipoPrice}/share</p>
                  </div>
                </div>
              </div>
          )}
          </>
        }
      </div>
    </div>);

};

// ─── Tab Bar ──────────────────────────────────────────────────────────────
const TabBar = ({ active, onTab, notifCount }) => {
  const tabs = [
  { id: 'dashboard', icon: 'home', label: 'Home' },
  { id: 'calendar', icon: 'clock', label: 'Calendar' },
  { id: 'watchlist', icon: 'star', label: 'Watchlist' },
  { id: 'portfolio', icon: 'chart', label: 'Portfolio' },
  { id: 'explore', icon: 'search', label: 'Explore' }];

  return (
    <div style={{ display: 'flex', background: 'var(--bg2)', borderTop: '1px solid var(--border)', paddingBottom: 0 }}>
      {tabs.map((t) =>
      <button key={t.id} onClick={() => onTab(t.id)} style={{
        flex: 1, padding: '10px 0 8px', background: 'transparent', border: 'none', cursor: 'pointer',
        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, position: 'relative'
      }}>
          {t.id === 'watchlist' && notifCount > 0 &&
        <div style={{ position: 'absolute', top: 8, right: '50%', transform: 'translateX(8px)', width: 16, height: 16, borderRadius: '50%', background: 'var(--gold)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <span style={{ fontSize: 9, fontWeight: 700, color: '#0D0D0F' }}>{notifCount}</span>
            </div>
        }
          <Icon name={t.icon} size={20} color={active === t.id ? 'var(--gold)' : 'var(--text3)'} />
          <span style={{ fontSize: 9, color: active === t.id ? 'var(--gold)' : 'var(--text3)', fontWeight: active === t.id ? 600 : 400 }}>{t.label}</span>
        </button>
      )}
    </div>);

};

// ─── Main App ─────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dashboardVariant": "A",
  "accentColor": "#D4A843",
  "compactCards": false,
  "showHypeMeter": true,
  "lightMode": false
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  // Example pre-populated state so users can see the full experience
  const EXAMPLE_SECTORS = ['ai', 'fintech', 'space', 'cybersec'];
  const EXAMPLE_FAVORITES = [
  // Already IPO'd — shows price, return %, IPO price comparison
  { id: 'coreweave', name: 'CoreWeave', ticker: 'CRWV', sector: 'cloud', status: 'Listed', valuation: '$23B', eta: 'Listed March 2025', etaDate: '2025-03-28', ipoPrice: 40, currentPrice: 54.8, description: 'CoreWeave is the AI cloud infrastructure company that IPO\'d in March 2025. GPU cloud computing for AI labs.', newsHeadline: 'CoreWeave Q1 2026 revenue triples YoY on AI compute surge', newsDate: 'May 2, 2026', hype: 89, confidence: 100, tags: ['GPU Cloud', 'AI Infrastructure'] },
  { id: 'zeekr', name: 'Zeekr', ticker: 'ZK', sector: 'ev', status: 'Listed', valuation: '$6.8B', eta: 'Listed May 2024', etaDate: '2024-05-10', ipoPrice: 21, currentPrice: 17.4, description: 'Zeekr, Geely\'s premium EV brand, listed on NYSE in May 2024. Competing with Tesla in China and expanding to Europe.', newsHeadline: 'Zeekr launches right-hand-drive 001 for UK and Australia', newsDate: 'Apr 27, 2026', hype: 67, confidence: 100, tags: ['China EV', 'Premium', 'Geely'] },
  // Pre-IPO favourites — shows ETA, status, hype
  { id: 'stripe', name: 'Stripe', ticker: null, sector: 'fintech', status: 'Filed S-1', valuation: '$70B', eta: 'Q2 2026', etaDate: '2026-06-01', description: 'Stripe, the global payments giant, has filed its S-1. Biggest anticipated fintech IPO in years.', newsHeadline: 'Stripe confidentially files S-1, Goldman Sachs leading', newsDate: 'Apr 15, 2026', hype: 97, confidence: 88, tags: ['Payments', 'Infrastructure'] },
  { id: 'openai', name: 'OpenAI', ticker: null, sector: 'ai', status: 'Rumored', valuation: '$157B', eta: 'Q4 2025', etaDate: '2025-12-01', description: 'OpenAI, maker of ChatGPT. IPO discussions ongoing after restructuring to for-profit.', newsHeadline: 'OpenAI restructures to for-profit to pave IPO path', newsDate: 'Apr 28, 2026', hype: 98, confidence: 72, tags: ['LLM', 'Consumer AI'] },
  { id: 'wiz', name: 'Wiz', ticker: null, sector: 'cybersec', status: 'Filed S-1', valuation: '$32B', eta: 'Q1 2026', etaDate: '2026-03-15', description: 'Wiz cloud security rejected Google\'s $23B offer and is aggressively pursuing IPO.', newsHeadline: 'Wiz hits $500M ARR, appoints JPMorgan for IPO process', newsDate: 'May 1, 2026', hype: 94, confidence: 90, tags: ['Cloud Security', 'CNAPP'] }];

  const EXAMPLE_NOTIFICATIONS = {
    stripe: { day_of: true, day_before: true, '1_week': true },
    wiz: { day_of: true, news: true }
  };

  // Fix 1: persist state in localStorage so refresh doesn't lose progress
  // BUT keep Get Started flow working — only skip onboarding if explicitly completed
  const [onboarded, setOnboarded] = useState(() => {
    try {return JSON.parse(localStorage.getItem('fsb_onboarded') || 'false');} catch {return false;}
  });
  const [userSectors, setUserSectors] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('fsb_sectors') || 'null');
      return saved || EXAMPLE_SECTORS;
    } catch {return EXAMPLE_SECTORS;}
  });
  const [favorites, setFavorites] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('fsb_favorites') || 'null');
      return saved || EXAMPLE_FAVORITES;
    } catch {return EXAMPLE_FAVORITES;}
  });
  const [notifications, setNotifications] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('fsb_notifications') || 'null');
      return saved || EXAMPLE_NOTIFICATIONS;
    } catch {return EXAMPLE_NOTIFICATIONS;}
  });
  const [tab, setTab] = useState('dashboard');
  const [stack, setStack] = useState([]); // [{screen, props}]

  // Flatten all companies for search
  const allCompanies = useMemo(() => {
    const arr = [];
    Object.values(IPO_DATA).forEach((companies) => arr.push(...companies));
    return arr;
  }, []);

  const notifCount = useMemo(() =>
  Object.values(notifications).filter((n) => Object.values(n).some(Boolean)).length,
  [notifications]
  );

  // Persist changes to localStorage
  useEffect(() => {try {localStorage.setItem('fsb_onboarded', JSON.stringify(onboarded));} catch {}}, [onboarded]);
  useEffect(() => {try {localStorage.setItem('fsb_sectors', JSON.stringify(userSectors));} catch {}}, [userSectors]);
  useEffect(() => {try {localStorage.setItem('fsb_favorites', JSON.stringify(favorites));} catch {}}, [favorites]);
  useEffect(() => {try {localStorage.setItem('fsb_notifications', JSON.stringify(notifications));} catch {}}, [notifications]);

  const handleOnboard = (sectors) => {
    setUserSectors(sectors);
    setOnboarded(true);
  };

  const toggleFav = (company) => {
    setFavorites((prev) => {
      const exists = prev.some((f) => f.id === company.id);
      if (exists) return prev; // already in, don't duplicate
      return [...prev, company];
    });
  };

  const addToFav = (company) => {
    setFavorites((prev) => {
      if (prev.some((f) => f.id === company.id)) return prev;
      return [...prev, company];
    });
  };

  const removeFav = (company) => {
    setFavorites((prev) => prev.filter((f) => f.id !== company.id));
  };

  const toggleFavFromSector = (company) => {
    setFavorites((prev) => {
      const exists = prev.some((f) => f.id === company.id);
      if (exists) return prev.filter((f) => f.id !== company.id);
      return [...prev, company];
    });
  };

  const toggleNotif = (company, notifId = null) => {
    if (notifId) {
      setNotifications((prev) => ({
        ...prev,
        [company.id]: {
          ...(prev[company.id] || {}),
          [notifId]: !prev[company.id]?.[notifId]
        }
      }));
    } else {
      // Toggle all default notifs on/off
      setNotifications((prev) => {
        const existing = prev[company.id];
        const anyOn = existing && Object.values(existing).some(Boolean);
        if (anyOn) {
          const cleared = { ...prev };
          delete cleared[company.id];
          return cleared;
        }
        return {
          ...prev,
          [company.id]: { day_of: true, day_before: true }
        };
      });
    }
  };

  const pushScreen = (screen) => setStack((s) => [...s, screen]);
  const popScreen = () => setStack((s) => s.slice(0, -1));

  // Update accent + theme from tweaks
  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--gold', tweaks.accentColor);
    r.style.setProperty('--gold-dim', tweaks.accentColor + '26');
    r.style.setProperty('--gold-glow', tweaks.accentColor + '59');
    r.style.setProperty('--border-gold', tweaks.accentColor + '40');
    r.style.setProperty('--gold-light', tweaks.accentColor);
    if (tweaks.lightMode) {
      r.style.setProperty('--bg', '#F5F4F0');
      r.style.setProperty('--bg2', '#ECEAE4');
      r.style.setProperty('--bg3', '#E4E2DC');
      r.style.setProperty('--bg4', '#D8D6D0');
      r.style.setProperty('--surface', '#FFFFFF');
      r.style.setProperty('--surface2', '#F0EEE8');
      r.style.setProperty('--border', 'rgba(0,0,0,0.08)');
      r.style.setProperty('--text', '#18181A');
      r.style.setProperty('--text2', '#5A5868');
      r.style.setProperty('--text3', '#9A9898');
    } else {
      r.style.setProperty('--bg', '#0D0D0F');
      r.style.setProperty('--bg2', '#13131A');
      r.style.setProperty('--bg3', '#1A1A24');
      r.style.setProperty('--bg4', '#22222F');
      r.style.setProperty('--surface', '#1E1E2A');
      r.style.setProperty('--surface2', '#252535');
      r.style.setProperty('--border', 'rgba(255,255,255,0.07)');
      r.style.setProperty('--text', '#F0EFE8');
      r.style.setProperty('--text2', '#9A9898');
      r.style.setProperty('--text3', '#5A5868');
    }
  }, [tweaks.accentColor, tweaks.lightMode]);

  // Build main screen content
  const renderMainContent = () => {
    if (!onboarded) return <OnboardingScreen onDone={handleOnboard} />;

    if (stack.length > 0) {
      const top = stack[stack.length - 1];
      if (top.type === 'sector') return (
        <SectorScreen
          sector={top.sector}
          ipoData={IPO_DATA}
          favorites={favorites}
          notifications={notifications}
          onBack={popScreen}
          onCompanyPress={(c) => pushScreen({ type: 'company', company: c })}
          onToggleFav={toggleFavFromSector}
          onToggleNotif={toggleNotif} />);


      if (top.type === 'company') return (
        <CompanyScreen
          company={top.company}
          favorites={favorites}
          notifications={notifications}
          onBack={popScreen}
          onToggleFav={toggleFavFromSector}
          onToggleNotif={toggleNotif} />);


    }

    if (tab === 'dashboard') return (
      <DashboardScreen
        sectors={userSectors}
        favorites={favorites}
        notifications={notifications}
        ipoData={IPO_DATA}
        onSectorPress={(s) => pushScreen({ type: 'sector', sector: s })}
        onCompanyPress={(c) => pushScreen({ type: 'company', company: c })}
        onToggleFav={toggleFavFromSector}
        onFavRemove={removeFav}
        dashboardVariant={tweaks.dashboardVariant} />);


    if (tab === 'watchlist') return (
      <FavoritesScreen
        favorites={favorites}
        onCompanyPress={(c) => pushScreen({ type: 'company', company: c })}
        onRemoveFav={removeFav}
        onAddFav={addToFav}
        allCompanies={allCompanies} />);


    if (tab === 'alerts') return (
      <NotificationsScreen
        notifications={notifications}
        favorites={favorites}
        allCompanies={allCompanies}
        onToggleNotif={toggleNotif} />);


    if (tab === 'calendar') return (
      <CalendarScreen
        sectors={userSectors}
        ipoData={IPO_DATA}
        onCompanyPress={(c) => pushScreen({ type: 'company', company: c })} />);


    if (tab === 'portfolio') return (
      <PortfolioScreen
        favorites={favorites} />);


    if (tab === 'explore') return (
      <ExploreScreen
        sectors={userSectors}
        allSectors={SECTORS}
        onSectorToggle={(id) => setUserSectors((prev) => prev.includes(id) ? prev.filter((s) => s !== id) : [...prev, id])}
        onSectorPress={(s) => pushScreen({ type: 'sector', sector: s })}
        ipoData={IPO_DATA}
        onCompanyPress={(c) => pushScreen({ type: 'company', company: c })}
        customCompanies={[]}
        onAddCustom={addToFav} />);


  };

  const showTabBar = onboarded;

  // When on a sub-screen, tapping a tab should clear the stack and go to that tab
  const handleTab = (t) => {
    setStack([]);
    setTab(t);
  };

  return (
    <div style={{ width: '100vw', minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#000' }}>
      <IOSDevice dark={true} width={390} height={844}>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
          <div style={{ flex: 1, overflow: 'hidden' }}>
            {renderMainContent()}
          </div>
          {showTabBar &&
          <TabBar active={tab} onTab={handleTab} notifCount={notifCount} />
          }
        </div>
      </IOSDevice>

      <TweaksPanel>
        <TweakSection label="Dashboard">
          <TweakRadio label="Layout" value={tweaks.dashboardVariant} options={['A', 'B']} onChange={(v) => setTweak('dashboardVariant', v)} />
        </TweakSection>
        <TweakSection label="Appearance">
          <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={(v) => setTweak('accentColor', v)} />
          <TweakToggle label="Light Mode" value={tweaks.lightMode} onChange={(v) => setTweak('lightMode', v)} />
          <TweakToggle label="Compact Cards" value={tweaks.compactCards} onChange={(v) => setTweak('compactCards', v)} />
          <TweakToggle label="Show Hype Meter" value={tweaks.showHypeMeter} onChange={(v) => setTweak('showHypeMeter', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>);

};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
